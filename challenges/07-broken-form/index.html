<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenge 07: Broken Form</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      background: #f7f3fb;
      color: #2a1a3a;
    }
    header {
      background: #652d90;
      color: #fff;
      padding: 40px 20px;
      text-align: center;
    }
    main {
      max-width: 480px;
      margin: 40px auto;
      padding: 0 20px;
    }
    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #e2d6ef;
      border-radius: 6px;
      font: inherit;
    }
    button {
      margin-top: 20px;
      background: #652d90;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #7a3aad; }
  </style>
</head>
<body>
  <header>
    <h1>Contact Integify</h1>
  </header>
  <main>
    <form action="thanks.html" method="get">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="4" required></textarea>

      <button type="submit">Send</button>
    </form>
  </main>
</body>
</html>
