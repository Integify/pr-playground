<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenge 02: Typo Fix</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
      background: #f7f3fb;
      margin: 0;
      color: #2a1a3a;
    }
    header {
      background: #652d90;
      color: #fff;
      padding: 40px 20px;
      text-align: center;
    }
    main {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>About Integify</h1>
  </header>
  <main>
    <p>
      Integify is a software development company based in The Gambia, building
      web, mobile, and AI-powered solutions for businesses across the region.
      We believe in shipping quality work and helping local talent grow.
    </p>
  </main>
</body>
</html>
