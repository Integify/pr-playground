<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenge 09: Broken Link</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      background: #f7f3fb;
      color: #2a1a3a;
    }
    header {
      background: #652d90;
      color: #fff;
      padding: 24px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    nav a {
      color: #fff;
      margin-left: 16px;
      text-decoration: none;
    }
    nav a:hover { text-decoration: underline; }
    section {
      max-width: 700px;
      margin: 0 auto;
      padding: 60px 20px;
      min-height: 70vh;
    }
    #contact {
      background: #efe6f7;
      border-radius: 8px;
    }
    h2 { color: #652d90; }
  </style>
</head>
<body>
  <header>
    <strong>Integify</strong>
    <nav>
      <a href="#about">About</a>
      <a href="#services">Services</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section id="about">
    <h2>About</h2>
    <p>Integify builds web, mobile, and AI-powered products.</p>
  </section>

  <section id="services">
    <h2>Services</h2>
    <p>We help teams ship software that works in the real world.</p>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <p>Email us at info@integify.io</p>
  </section>
</body>
</html>
